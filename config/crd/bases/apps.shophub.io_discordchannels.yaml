---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: discordchannels.apps.shophub.io
spec:
  group: apps.shophub.io
  names:
    kind: DiscordChannel
    listKind: DiscordChannelList
    plural: discordchannels
    singular: discordchannel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.shopRef
      name: Shop
      type: string
    - jsonPath: .spec.channelName
      name: Channel
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: DiscordChannel is the Schema for the discordchannels API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DiscordChannelSpec defines the desired state of DiscordChannel.
            properties:
              channelName:
                description: ChannelName is the desired Discord channel name for this
                  shop's alert notifications.
                minLength: 1
                type: string
              guildId:
                description: |-
                  GuildID is the Discord server (guild) this channel should be created in — the shop
                  owner's own server, once they've invited the bot to it. Left empty, the reconciler falls
                  back to the operator's own default guild (DISCORD_GUILD_ID), which is also how
                  shophub-app's own platform-level alert channel is provisioned (it never sets this field).
                type: string
              shopRef:
                description: ShopRef is the name of the owning Shop resource, in the
                  same namespace.
                minLength: 1
                type: string
            required:
            - channelName
            - shopRef
            type: object
          status:
            description: DiscordChannelStatus defines the observed state of DiscordChannel.
            properties:
              channelId:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              webhookId:
                description: |-
                  WebhookID is the Discord webhook backing this channel's alert notifications. It is not
                  sensitive on its own (unlike the webhook's token/URL, which lives in the Secret named by
                  WebhookSecretRef) and is kept here so the controller can delete the webhook on cleanup.
                type: string
              webhookSecretRef:
                description: |-
                  WebhookSecretRef is the name, in the same namespace, of the Secret holding this channel's
                  webhook URL (key "webhookUrl") — e.g. for Alertmanager to reference. The URL itself is
                  never stored here since it embeds the webhook's secret token.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
