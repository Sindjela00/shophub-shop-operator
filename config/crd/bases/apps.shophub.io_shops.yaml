---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: shops.apps.shophub.io
spec:
  group: apps.shophub.io
  names:
    kind: Shop
    listKind: ShopList
    plural: shops
    singular: shop
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.availability
      name: Availability
      type: string
    - jsonPath: .spec.databaseKind
      name: Database
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: Shop is the Schema for the shops API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ShopSpec defines the desired state of Shop.
            properties:
              availability:
                default: standard
                description: 'Availability controls replica count: standard=2, high=3.'
                enum:
                - standard
                - high
                type: string
              databaseKind:
                default: standard
                description: 'DatabaseKind selects the shop''s database: standard=PostgreSQL
                  (CNPG), light=Redis.'
                enum:
                - standard
                - light
                type: string
              name:
                description: Name is the shop's display name.
                minLength: 1
                type: string
              walletAddress:
                description: WalletAddress is the on-chain address that receives this
                  shop's customer payments.
                minLength: 1
                type: string
            required:
            - name
            - walletAddress
            type: object
          status:
            description: |-
              ShopStatus defines the observed state of Shop.
              internal/controller/shop_controller.go. Until then this is always empty on freshly
              created resources, which is expected: a CRD's API server accepts and stores spec/status
              regardless of whether any controller is running to reconcile it.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              phase:
                description: ShopPhase is a coarse summary of a Shop's reconciliation
                  state.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
