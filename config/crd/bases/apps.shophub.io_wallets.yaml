# Hand-written stand-in for what `controller-gen crd` would generate from
# api/v1/wallet_types.go — regenerate and replace once Go/kubebuilder are installed.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wallets.apps.shophub.io
spec:
  group: apps.shophub.io
  names:
    kind: Wallet
    listKind: WalletList
    plural: wallets
    singular: wallet
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Shop
          type: string
          jsonPath: .spec.shopRef
        - name: Address
          type: string
          jsonPath: .spec.address
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [shopRef, address]
              properties:
                shopRef:
                  type: string
                  minLength: 1
                address:
                  type: string
                  minLength: 1
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
