# CI pipeline — triggered on every PR against develop/master, and publishes an operator
# image to GHCR on merge to master.
name: CI
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test $(go list ./... | grep -v /test/integration)

      # envtest downloads a real (ephemeral) etcd + kube-apiserver pair — no full cluster, but
      # a genuine API server, so test/integration exercises real CRD validation and the real
      # controller-runtime watch/cache machinery instead of the fake client the unit tests use.
      - name: Setup envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.31.0 -p path)" >> "$GITHUB_ENV"

      - name: Integration tests (envtest)
        run: go test ./test/integration/...

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
