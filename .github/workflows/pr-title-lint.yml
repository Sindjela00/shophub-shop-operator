# Enforces Conventional Commits (https://www.conventionalcommits.org) on PR titles,
# since squash-merging uses the PR title as the resulting commit message.
name: PR title lint
on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
